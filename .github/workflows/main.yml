name: Build boosterik.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --name boosterik
          --icon boosterik.ico
          --add-data "boosterik.ico;."
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: boosterik-1.12
          path: dist/boosterik.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/boosterik.exe
